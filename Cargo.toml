[package]
name = "rust-gmp-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "rust_gmp_runtime"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]

[features]
allocator-benchmark = []
scheduler-benchmark = []
scheduler-diagnostics = []
runtime-benchmark-instrumentation = []

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "routine_lifecycle"
harness = false

[[bench]]
name = "stack_engine_scalability"
harness = false

[[bench]]
name = "routine_execution_ab"
harness = false

[[bench]]
name = "routine_processor_cache_ab"
harness = false

[[bench]]
name = "stack_trim_workers"
harness = false

[[bench]]
name = "pool_contention"
harness = false

[[bench]]
name = "context_switching"
harness = false

[[bench]]
name = "machine_dispatch"
harness = false

[[bench]]
name = "machine_dispatch_stabilized"
harness = false

[[bench]]
name = "machine_processor_cache_ab"
harness = false

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "scheduler_isolated"
harness = false

[[bench]]
name = "scheduler_steal"
harness = false
required-features = ["scheduler-benchmark"]

[[bench]]
name = "scheduler_diagnostics"
harness = false
required-features = ["scheduler-diagnostics"]

[[bench]]
name = "scheduler_attribution"
harness = false
required-features = ["scheduler-benchmark"]

[[bench]]
name = "workload_cpu"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "mapping_layout"
harness = false

[[bench]]
name = "allocator_concurrent"
harness = false
required-features = ["allocator-benchmark"]

[[bench]]
name = "allocator_high_cardinality"
harness = false
required-features = ["allocator-benchmark"]

[[bench]]
name = "block_stack_compare"
harness = false
required-features = ["allocator-benchmark"]

[[bench]]
name = "allocator_tournament"
harness = false
required-features = ["allocator-benchmark"]

[[bench]]
name = "allocator_memory"
harness = false
required-features = ["allocator-benchmark"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
unwrap_in_result = "deny"
wildcard_enum_match_arm = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_errors_doc = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[workspace]
